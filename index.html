<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nabta Alkon – Dossier technique</title>
<meta name="description" content="Nabta Alkon : pyrolyse, biochar et captation du CO₂.">
<meta property="og:title" content="Nabta Alkon – Dossier technique">
<meta property="og:type" content="website">
<style>
  :root{--fg:#101614;--mut:#55625c;--line:#e3e8e5;--acc:#c8102e;--gold:#f2b84b}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:#fff;color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:18px;line-height:1.4;-webkit-text-size-adjust:100%}
  header{padding:22px 18px 14px}
  header h1{margin:0;font-size:1.9rem;line-height:1.15;font-weight:800;letter-spacing:-.01em}
  header p{margin:8px 0 0;color:var(--mut);font-size:1.05rem}
  .video{position:relative;background:#000}
  .video video{display:block;width:100%;height:auto;aspect-ratio:1280/558;background:#000}
  #son{position:absolute;left:12px;right:12px;bottom:56px;background:var(--gold);color:#1a1405;border:0;border-radius:12px;padding:16px;font-size:1.15rem;font-weight:800;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.35)}
  #son[hidden]{display:none}
  .count{padding:22px 18px 8px;font-size:1.15rem;font-weight:700;color:var(--mut)}
  .pg{border-top:1px solid var(--line);margin:0}
  .pg img{display:block;width:100%;height:auto;cursor:zoom-in}
  .zoom{display:block;width:100%;background:#fff;color:var(--fg);border:0;border-top:1px solid var(--line);padding:18px;font-size:1.15rem;font-weight:700;text-align:center;cursor:pointer}
  .zoom:active{background:#f1f4f2}
  footer{padding:28px 18px 40px;color:var(--mut);font-size:.95rem;text-align:center;border-top:1px solid var(--line)}
  /* lecture en grand */
  #lb{position:fixed;inset:0;z-index:50;background:#fff;display:none;flex-direction:column}
  #lb.on{display:flex}
  #lb .top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:#fff}
  #lb .top b{flex:1;text-align:center;font-size:1.1rem}
  #lb button{background:#eef2f0;color:var(--fg);border:0;border-radius:12px;min-width:54px;min-height:54px;padding:0 16px;font-size:1.3rem;font-weight:800}
  #lb button.x{background:var(--acc);color:#fff;font-size:1.05rem}
  #lb .zone{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom;background:#fff}
  #lb img{display:block;width:260vw;max-width:none;height:auto}
  #lb .hint{flex:0 0 auto;text-align:center;color:var(--mut);font-size:.9rem;padding:8px 12px;border-top:1px solid var(--line)}
  @media (orientation:landscape){#lb img{width:100vw}#lb .hint{display:none}}
  @media (min-width:900px){
    body{font-size:17px}
    header,.count,footer{max-width:1100px;margin:0 auto}
    .video,.pg{max-width:1100px;margin:0 auto}
    .video video{border-radius:0}
    #lb img{width:min(100vw,1500px);margin:0 auto}
    #son{left:auto;right:16px;width:auto;padding:12px 22px}
  }
</style>
</head>
<body>
  <header>
    <h1>Nabta Alkon</h1>
    <p>Pyrolyse · biochar · captation du CO₂</p>
  </header>

  <section class="video">
    <video id="v" src="video.mp4" poster="poster.jpg" autoplay muted loop playsinline controls preload="auto"></video>
    <button id="son" type="button">🔊 Activer le son</button>
  </section>

  <div class="count">Dossier technique · 15 pages</div>
  <main>
    <article class="pg" data-p="1">
      <img src="pages/p01.jpg" alt="Page 1 du dossier technique" width="1920" height="1080" loading="lazy" decoding="async">
      <button class="zoom" type="button" data-p="1">🔍 Agrandir la page 1</button>
    </article>
    <article class="pg" data-p="2">
      <img src="pages/p02.jpg" alt="Page 2 du dossier technique" width="1920" height="1080" loading="lazy" decoding="async">
      <button class="zoom" type="button" data-p="2">🔍 Agrandir la page 2</button>
    </article>
    <article class="pg" data-p="3">
      <img src="pages/p03.jpg" alt="Page 3 du dossier technique" width="1920" height="1080" loading="lazy" decoding="async">
      <button class="zoom" type="button" data-p="3">🔍 Agrandir la page 3</button>
    </article>
    <article class="pg" data-p="4">
      <img src="pages/p04.jpg" alt="Page 4 du dossier technique" width="1920" height="1080" loading="lazy" decoding="async">
      <button class="zoom" type="button" data-p="4">🔍 Agrandir la page 4</button>
    </article>
    <article class="pg" data-p="5">
      <img src="pages/p05.jpg" alt="Page 5 du dossier technique" width="1920" height="1080" loading="lazy" decoding="async">
      <button class="zoom" type="button" data-p="5">🔍 Agrandir la page 5</button>
    </article>
    <article class="pg" data-p="6">
      <img src="pages/p06.jpg" alt="Page 6 du dossier technique" width="1920" height="1080" loading="lazy" decoding="async">
      <button class="zoom" type="button" data-p="6">🔍 Agrandir la page 6</button>
    </article>
    <article class="pg" data-p="7">
      <img src="pages/p07.jpg" alt="Page 7 du dossier technique" width="1920" height="1080" loading="lazy" decoding="async">
      <button class="zoom" type="button" data-p="7">🔍 Agrandir la page 7</button>
    </article>
    <article class="pg" data-p="8">
      <img src="pages/p08.jpg" alt="Page 8 du dossier technique" width="1920" height="1080" loading="lazy" decoding="async">
      <button class="zoom" type="button" data-p="8">🔍 Agrandir la page 8</button>
    </article>
    <article class="pg" data-p="9">
      <img src="pages/p09.jpg" alt="Page 9 du dossier technique" width="1920" height="1080" loading="lazy" decoding="async">
      <button class="zoom" type="button" data-p="9">🔍 Agrandir la page 9</button>
    </article>
    <article class="pg" data-p="10">
      <img src="pages/p10.jpg" alt="Page 10 du dossier technique" width="1920" height="1080" loading="lazy" decoding="async">
      <button class="zoom" type="button" data-p="10">🔍 Agrandir la page 10</button>
    </article>
    <article class="pg" data-p="11">
      <img src="pages/p11.jpg" alt="Page 11 du dossier technique" width="1920" height="1080" loading="lazy" decoding="async">
      <button class="zoom" type="button" data-p="11">🔍 Agrandir la page 11</button>
    </article>
    <article class="pg" data-p="12">
      <img src="pages/p12.jpg" alt="Page 12 du dossier technique" width="1920" height="1080" loading="lazy" decoding="async">
      <button class="zoom" type="button" data-p="12">🔍 Agrandir la page 12</button>
    </article>
    <article class="pg" data-p="13">
      <img src="pages/p13.jpg" alt="Page 13 du dossier technique" width="1920" height="1080" loading="lazy" decoding="async">
      <button class="zoom" type="button" data-p="13">🔍 Agrandir la page 13</button>
    </article>
    <article class="pg" data-p="14">
      <img src="pages/p14.jpg" alt="Page 14 du dossier technique" width="1920" height="1080" loading="lazy" decoding="async">
      <button class="zoom" type="button" data-p="14">🔍 Agrandir la page 14</button>
    </article>
    <article class="pg" data-p="15">
      <img src="pages/p15.jpg" alt="Page 15 du dossier technique" width="1920" height="1080" loading="lazy" decoding="async">
      <button class="zoom" type="button" data-p="15">🔍 Agrandir la page 15</button>
    </article>
  </main>

  <footer>Nabta Alkon · dossier technique</footer>

  <div id="lb" role="dialog" aria-modal="true" aria-label="Lecture en grand">
    <div class="top">
      <button id="lbp" type="button" aria-label="Page précédente">‹</button>
      <b id="lbt">Page 1 / 15</b>
      <button id="lbn" type="button" aria-label="Page suivante">›</button>
      <button id="lbx" class="x" type="button" aria-label="Fermer">Fermer</button>
    </div>
    <div class="zone" id="lbz"><img id="lbi" alt=""></div>
    <div class="hint">Glissez pour lire · pincez pour zoomer · tournez le téléphone pour voir la page entière</div>
  </div>

<script>
  var v=document.getElementById('v'),b=document.getElementById('son');
  v.play&&v.play().catch(function(){});
  b.addEventListener('click',function(){v.muted=false;v.currentTime=0;v.play();b.hidden=true});
  v.addEventListener('volumechange',function(){if(!v.muted)b.hidden=true});

  var lb=document.getElementById('lb'),lbi=document.getElementById('lbi'),lbt=document.getElementById('lbt'),lbz=document.getElementById('lbz'),n=1;
  function show(k){if(k<1)k=1;if(k>15)k=15;n=k;lbi.src='pages/p'+(k<10?'0':'')+k+'.jpg';lbi.alt='Page '+k+' du dossier technique';lbt.textContent='Page '+k+' / 15';lbz.scrollTo(0,0)}
  function open(k){show(k);lb.classList.add('on');document.body.style.overflow='hidden'}
  function close(){lb.classList.remove('on');document.body.style.overflow=''}
  document.querySelectorAll('.pg').forEach(function(a){
    var p=+a.dataset.p;
    a.querySelector('img').addEventListener('click',function(){open(p)});
    a.querySelector('.zoom').addEventListener('click',function(){open(p)});
  });
  document.getElementById('lbx').onclick=close;
  document.getElementById('lbp').onclick=function(){show(n-1)};
  document.getElementById('lbn').onclick=function(){show(n+1)};
  document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(n-1);if(e.key==='ArrowRight')show(n+1)});
</script>
</body>
</html>
