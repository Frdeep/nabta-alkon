<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nabta Alkon – Vidéo de présentation</title>
<meta name="description" content="Vidéo de présentation de Nabta Alkon : pyrolyse, biochar et captation du CO₂.">
<meta property="og:title" content="Nabta Alkon – Vidéo de présentation">
<meta property="og:type" content="website">
<style>
  :root{--bg:#0d1411;--fg:#f2f5f3;--mut:#9fb0a8;--acc:#e8b04a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:16px}
  h1{font-size:clamp(1.1rem,2.6vw,1.6rem);font-weight:600;margin:0;text-align:center}
  .wrap{position:relative;width:min(100%,1100px)}
  video{width:100%;height:auto;display:block;border-radius:12px;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  #son{position:absolute;right:12px;bottom:56px;background:var(--acc);color:#1a1405;border:0;border-radius:999px;padding:10px 18px;font-size:1rem;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4)}
  #son[hidden]{display:none}
  p{color:var(--mut);margin:0;font-size:.9rem;text-align:center}
</style>
</head>
<body>
  <h1>Nabta Alkon</h1>
  <div class="wrap">
    <video id="v" src="video.mp4" poster="poster.jpg" autoplay muted loop playsinline controls preload="auto"></video>
    <button id="son" type="button">🔊 Activer le son</button>
  </div>
  <p>Pyrolyse · biochar · captation du CO₂</p>
<script>
  var v=document.getElementById('v'),b=document.getElementById('son');
  v.play&&v.play().catch(function(){});
  b.addEventListener('click',function(){v.muted=false;v.currentTime=0;v.play();b.hidden=true});
  v.addEventListener('volumechange',function(){if(!v.muted)b.hidden=true});
</script>
</body>
</html>
